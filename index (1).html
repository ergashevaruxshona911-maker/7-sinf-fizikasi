<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;border-radius:16px;padding:22px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0 18px}.grid button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}.grid button:hover{border-color:var(--pri)}

.lh{margin:4px 0 12px}.lh small{color:var(--mut)}.lh h1{margin:2px 0;font-size:24px}

.bsb th{padding:8px;font-size:14px}.bsb th.c1{background:var(--b1)}.bsb th.c2{background:var(--b2)}.bsb th.c3{background:var(--b3)}.bsb td{padding:6px;vertical-align:top;border:1px solid var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.sim{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.sim canvas{display:block;width:100%;height:auto;background:#fff}
.ctl{padding:8px 12px;background:#f8fafc;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px}.ctl label{font-size:12px;color:#334155;display:block}.ctl input{width:100%}.ctl output{font-weight:700;color:var(--pri)}
.btns{display:flex;gap:8px;padding:6px 12px;background:#f8fafc}.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
.ro{padding:8px 12px;font-size:13px;background:#eff6ff;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}.chips span{color:var(--mut)}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;cursor:pointer;font-size:13px}
.chips button.on.b{background:var(--b1);border-color:#60a5fa}.chips button.on.s{background:var(--b2);border-color:#f59e0b}.chips button.on.k{background:var(--b3);border-color:#22c55e}
.pause{background:#fffbeb;border:1px dashed #f59e0b;border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14px}.pause input{width:100%;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:14px}.quiz button.ok{background:#dcfce7;border-color:#22c55e}.quiz button.no{background:#fee2e2;border-color:#ef4444}
.nav{display:flex;justify-content:space-between;gap:10px;margin:20px 0 60px}.nav button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px}.nav button.g{background:#64748b}

<script>
/* ===== DARSLIK MAZMUNI ===== */
const LESSONS=[];
function L(id,g,t,items,q){LESSONS.push({id,g,t,items:items.map(a=>({h:a[0],x:a[1],l:a[2],s:a[3],o:a[4]||{}})),q});}
const G0='KIRISH',G1='KINEMATIKA ASOSLARI · I bob. Mexanik harakat haqida umumiy ma’lumotlar',G2='KINEMATIKA ASOSLARI · II bob. To‘g‘ri chiziqli harakat',G3='KINEMATIKA ASOSLARI · III bob. Tekis aylanma harakat',
G4='DINAMIKA ASOSLARI · IV bob. Harakat qonunlari',G5='DINAMIKA ASOSLARI · V bob. Tashqi kuchlar ta’sirida jismlarning harakati',G6='SAQLANISH QONUNLARI · VI bob. Impulsning saqlanish qonuni',G7='SAQLANISH QONUNLARI · VII bob. Ish va energiya. Energiyaning saqlanish qonuni',G8='ILOVA';

L('Kirish',G0,'Fizika fani va uning o‘rganish ob’ekti',[
[`Fizika fani va uning o‘rganish ob’ekti`,`Fizika — tabiat hodisalarini va ularning umumiy qonuniyatlarini o‘rganuvchi fan. Hodisalar turlari: <b>mexanik</b> (jismlarning harakati), <b>issiqlik</b>, <b>elektr</b>, <b>yorug‘lik</b> va <b>tovush</b> hodisalari. Fizikaning o‘rganish ob’ekti — materiya va uning harakat shakllari.`,`Cho‘ntak telefoningizda hamma hodisa bor: ekran — yorug‘lik, zaryadlash — elektr, titrash — mexanik harakat, uzoq ishlaganda qizishi — issiqlik hodisasi.`,'phenom',{k:0}],
[`Tabiatni o‘rganishda fizik eksperiment va nazariyaning o‘rni`,`Olim avval <b>kuzatadi</b>, <b>faraz</b> aytadi, keyin <b>tajriba</b> (eksperiment) bilan tekshiradi. Natijalar umumlashtirilib <b>nazariya</b> yaratiladi, nazariya esa yangi hodisalarni oldindan aytib beradi. Tajriba — nazariyaning haqiqiyligi mezoni.`,`Ob-havo prognozi: nazariya bo‘yicha hisob-kitob qilinadi, ertasi kuni kuzatish uni tasdiqlaydi yoki tuzatadi.`,'expTheory']
],['Fizik hodisaga qaysi biri misol bo‘ladi?',['Jismning tushishi','She’r yodlash','Narx kelishish'],0]);

L(1,G1,'Jismlarning harakati',[
[`Mexanik harakat tushunchasi va uning nisbiyligi`,`<b>Mexanik harakat</b> — jism vaziyatining vaqt o‘tishi bilan boshqa jismlarga nisbatan o‘zgarishi. Harakat <b>nisbiy</b>: bitta jism turli jismlarga nisbatan turlicha harakatlanadi — birinchisiga nisbatan tinch, ikkinchisiga nisbatan harakatda bo‘lishi mumkin.`,`Poyezdda o‘tirgan yo‘lovchi o‘rindiqqa nisbatan tinch, daraxtlarga nisbatan esa 60 km/soat tezlikda harakatlanmoqda. Pastdagi simulyatsiyada «sanoq jismi»ni almashtiring!`,'rel',{fr:0}],
[`Sanoq sistemasi va vaqtni o‘lchash`,`<b>Sanoq sistemasi</b> = <b>sanoq jismi</b> + unga bog‘langan <b>koordinata sistemasi</b> + <b>vaqtni o‘lchovchi soat</b>. Vaqt soat yoki sekundomer bilan o‘lchanadi, SI da asosiy birligi — sekund (s).`,`Futbol hakami o‘yin vaqtini soat bilan, to‘pning o‘rnini maydon chiziqlariga (koordinatalarga) nisbatan aniqlaydi.`,'clock']
],['Harakat nisbiyligi nimani bildiradi?',['Harakat sanoq jismiga bog‘liq','Harakat hech qachon tugamaydi','Tezlik doim o‘zgarmas'],0]);

L(2,G1,'Fazo va vaqt',[
[`Fazoning xossalari va geometrik tasviri`,`Fazo — jismlar joylashgan va harakatlanadigan «joy». Bizning fazomiz <b>uch o‘lchamli</b>: uzunlik, kenglik va balandlik. Nuqtaning o‘rni 3 ta koordinata (x, y, z) bilan beriladi; fazo bir jinsli (hamma nuqta teng) va izotrop (hamma yo‘nalish teng).`,`Dronning holatini aniqlash uchun balandlik ham kerak: GPS qurilma uchta koordinata beradi. Yo‘lda mashina holati esa 2 ta koordinata bilan yetarli.`,'space',{dm:3}],
[`Vaqt tushunchasi va uning o‘lchov birliklari`,`Vaqt — hodisalar ketma-ketligi va davomiyligini ifodalaydi, u faqat bir yo‘nalishda — o‘tmishdan kelajakka oqadi. Birliklari: sekund (s), minut (1 min = 60 s), soat (1 soat = 3600 s), sutka. Qadimda quyosh, qum, suv soatlari, hozir kvars va atom soatlari ishlatiladi.`,`Maktab qo‘ng‘irog‘i 45 minutlik darsni o‘lchaydi; sprinter natijasi 0,01 s aniqlikda o‘lchanadi.`,'clock',{L:0.5}]
],['Fazoning nechta o‘lchami bor?',['3','2','1'],0]);

L(3,G1,'Kinematikaning asosiy tushunchalari',[
[`Moddiy nuqta tushunchasi`,`Jism o‘lchamlarini hisobga olmasa ham bo‘ladigan holda uni <b>moddiy nuqta</b> deb olamiz — massasi bor, o‘lchami yo‘q ideal model. Bu jism bosib o‘tgan masofa uning o‘lchamidan ancha katta bo‘lganda o‘rinli.`,`Toshkentdan Samarqandga ketayotgan avtobusni nuqta deb olamiz; garajga qo‘yayotganda esa uning uzunligi muhim.`,'matpoint'],
[`Trayektoriya, yo‘l va ko‘chish`,`<b>Trayektoriya</b> — jism harakatlanganda qoldirgan chiziq. <b>Yo‘l</b> (s) — trayektoriya uzunligi (skalyar). <b>Ko‘chish</b> — boshlang‘ich nuqtadan oxirgi nuqtaga yo‘nalgan to‘g‘ri kesma (vektor). Yo‘l ko‘chish modulidan kichik bo‘lmaydi.`,`Taksometr yo‘lni hisoblaydi, lekin uydan maktabgacha to‘g‘ri chiziqdagi masofa — ko‘chish. Aylanib uyga qaytsangiz, yo‘l bor, ko‘chish esa nol!`,'traj']
],['Boshlang‘ich nuqtaga qaytsak, ko‘chish nimaga teng?',['0','Yo‘lga teng','Cheksiz'],0]);

L(4,G1,'Skalyar va vektor kattaliklar hamda ular ustida amallar',[
[`Skalyar kattaliklar va ularning ta’rifi`,`Faqat son qiymati (va birligi) bilan aniqlanadigan kattaliklar — <b>skalyar</b>: massa, vaqt, yo‘l, temperatura, energiya. Ular oddiy arifmetik qo‘shiladi.`,`Do‘konda 3 kg olma va 4 kg nok — jami 7 kg. Yo‘nalish haqida hech kim so‘ramaydi.`,'sv'],
[`Vektor kattaliklar va ular ustida amallar`,`Son qiymati va <b>yo‘nalishi</b> bilan aniqlanadigan kattaliklar — <b>vektor</b>: ko‘chish, tezlik, kuch. Qo‘shish uchburchak yoki parallelogramm qoidasi bilan bajariladi: bir yo‘nalishda R = a + b, qarama-qarshi bo‘lsa R = |a − b|.`,`Daryodan qayiqda o‘tishda qayiq tezligi va oqim tezligi vektor sifatida qo‘shiladi — shuning uchun qayiq qiyshiq harakatlanadi.`,'vec']
],['Qaysi kattalik vektor?',['Kuch','Massa','Vaqt'],0]);

L(5,G2,'To‘g‘ri chiziqli tekis harakat haqida tushuncha',[
[`Tekis harakat ta’rifi`,`Jism istalgan <b>teng vaqt oraliqlarida teng yo‘llarni</b> bosib o‘tsa, bunday harakat to‘g‘ri chiziqli tekis harakat deyiladi. Bunda tezlik o‘zgarmaydi: v = const.`,`Yo‘lakcha bo‘ylab harakatlanuvchi eskalator yoki tekis yo‘lda bir xil tezlikda ketayotgan mashina taxminan tekis harakat qiladi.`,'strobe',{tp:0}],
[`Tezlik tushunchasi`,`<b>Tezlik</b> — jism bir birlik vaqtda necha birlik yo‘l bosishini ko‘rsatuvchi vektor kattalik: <b>v = s / t</b>. Tezlik qancha katta bo‘lsa, jism shuncha tez harakatlanadi.`,`Piyoda ≈ 1,5 m/s, velosipedchi ≈ 5 m/s, mashina ≈ 20 m/s, samolyot ≈ 250 m/s.`,'uni']
],['Tekis harakatda nima o‘zgarmas?',['Tezlik','Yo‘l','Vaqt'],0]);

L(6,G2,'To‘g‘ri chiziqli tekis harakat tezligi',[
[`Tezlik formulasi va o‘lchov birliklari`,`<b>v = s / t</b>. SI da tezlik birligi — <b>m/s</b>, hayotda ko‘pincha <b>km/soat</b>. 1 km/soat = 1/3,6 m/s, ya’ni km/soat → m/s uchun 3,6 ga bo‘linadi, m/s → km/soat uchun 3,6 ga ko‘paytiriladi.`,`Yo‘l belgisidagi 60 km/soat ≈ 16,7 m/s.`,'unit'],
[`Yo‘l va vaqtni hisoblash`,`Formuladan: <b>s = v·t</b>, <b>t = s / v</b>. Masalan, v = 10 m/s, t = 20 s bo‘lsa, s = 200 m. Hisoblashdan oldin birliklarni bir xil sistemaga keltiring.`,`Toshkent — Samarqand ≈ 300 km. 100 km/soat tezlik bilan taxminan 3 soat ketadi.`,'unit2']
],['72 km/soat necha m/s?',['20','72','7,2'],0]);

L(7,G2,'To‘g‘ri chiziqli tekis harakatning grafik tasviri',[
[`Yo‘lning vaqtga bog‘liqlik grafigi`,`Tekis harakatda s = s₀ + v·t — <b>to‘g‘ri chiziq</b>. Chiziqning qiyaligi tezlikka teng: qiyalik katta bo‘lsa, tezlik katta.`,`Ikki velosipedchi grafigini solishtirsangiz, qiyaroq chiziq — tezroq ketayotgan kishiniki.`,'unig',{v:6,s0:20}],
[`Tezlikning vaqtga bog‘liqlik grafigi`,`Tekis harakatda v(t) grafigi — t o‘qiga <b>parallel to‘g‘ri chiziq</b>. Grafik ostidagi to‘rtburchak yuzasi bosib o‘tilgan yo‘lga teng: <b>s = v·t</b>.`,`Spidometr strelkasi bir joyda qotib tursa, mashina tekis harakatda.`,'unig',{v:12,s0:0}]
],['Tekis harakatda v(t) grafigi qanday bo‘ladi?',['t o‘qiga parallel chiziq','Parabola','Og‘ma chiziq'],0]);

L(8,G2,'Notekis harakatda tezlik',[
[`O‘rtacha tezlik tushunchasi`,`Notekis harakatda <b>o‘rtacha tezlik</b> = butun yo‘l / butun vaqt: <b>v<sub>o‘rt</sub> = s / t</b>. U tezliklarning o‘rta arifmetigi emas!`,`Svetoforlarda to‘xtab, so‘ng yurib kelgan avtobusning o‘rtacha tezligi spidometrdagi eng katta tezlikdan ancha kichik.`,'avg'],
[`Oniy tezlik`,`Vaqtning berilgan paytidagi (yoki traektoriyaning berilgan nuqtasidagi) tezlik — <b>oniy tezlik</b>. Spidometr uni ko‘rsatadi. Δt juda kichik bo‘lsa, o‘rtacha tezlik oniy tezlikka yaqinlashadi.`,`Yo‘ldagi radar mashinaning aynan shu paytdagi oniy tezligini o‘lchaydi.`,'inst']
],['O‘rtacha tezlik qanday topiladi?',['Butun yo‘l / butun vaqt','Tezliklar yig‘indisi / 2','Yo‘l · vaqt'],0]);

L(9,G2,'Tekis o‘zgaruvchan harakatda tezlanish',[
[`Tezlanish tushunchasi va fizik ma’nosi`,`<b>Tezlanish</b> — tezlik o‘zgarishining tezligini ko‘rsatuvchi vektor kattalik: <b>a = (v − v₀) / t</b>. Tekis o‘zgaruvchan harakatda a = const. a &gt; 0 — tezlashish, a &lt; 0 — sekinlashish.`,`Svetofor yashil yonganda mashina 5 s da 0 dan 20 m/s gacha tezlashadi: a = 4 m/s².`,'acc',{v0:0,a:2}],
[`Tezlanishning birliklari`,`SI da tezlanish birligi — <b>m/s²</b>. a = 3 m/s² degani: har sekundda tezlik 3 m/s ga o‘zgaradi.`,`Sport mashinasi 3 s da 100 km/soat ga yetadi: a ≈ 9 m/s². Erkin tushishda a = 9,8 m/s².`,'acc',{v0:0,a:4}]
],['a = 3 m/s² nimani bildiradi?',['Har sekundda tezlik 3 m/s ga o‘zgaradi','Jism 3 m yo‘l bosadi','Tezlik 3 m/s'],0]);

L(10,G2,'Tekis o‘zgaruvchan harakat tezligi',[
[`Tezlikning vaqt bo‘yicha o‘zgarish qonuni`,`<b>v = v₀ + a·t</b>. Grafik — og‘ma to‘g‘ri chiziq; uning qiyaligi tezlanishga teng. v₀ — boshlang‘ich tezlik.`,`Tepalikdan velosipedda tushganda har sekundda tezligingiz ortib boradi.`,'accg',{v0:2,a:2}],
[`Boshlang‘ich va oxirgi tezliklar orasidagi munosabat`,`a = (v − v₀)/t; t = (v − v₀)/a. Tormozlashda a &lt; 0: to‘xtash (v = 0) uchun t = v₀/|a|.`,`Poyezd 20 m/s tezlikdan a = −0,5 m/s² bilan 40 s da to‘xtaydi.`,'acc',{v0:8,a:-2}]
],['v₀ = 2 m/s, a = 3 m/s² bo‘lsa, 2 s dan keyin v nimaga teng?',['8 m/s','5 m/s','6 m/s'],0]);

L(11,G2,'Tekis o‘zgaruvchan harakatda bosib o‘tilgan yo‘l',[
[`Yo‘lni hisoblash formulalari`,`<b>s = v₀t + at²/2</b>. v₀ = 0 bo‘lsa, s = at²/2. Boshqa ko‘rinishlar: s = (v + v₀)t/2; s = (v² − v₀²)/(2a).`,`Mashina 5 s da tinch holatdan a = 2 m/s² bilan tezlashsa, s = 2·25/2 = 25 m yo‘l bosadi.`,'accg',{v0:0,a:2}],
[`Grafik usulda yo‘lni aniqlash`,`v(t) grafigi ostidagi shakl (to‘rtburchak, uchburchak yoki trapetsiya) yuzasi bosib o‘tilgan yo‘lga teng.`,`Samolyotning uchish yo‘lagi uzunligi uning tezlik grafigi ostidagi yuzaga teng.`,'accg',{v0:6,a:1}]
],['Tezlik grafigi ostidagi yuza nimaga teng?',['Bosib o‘tilgan yo‘lga','Tezlanishga','Vaqtga'],0]);

L(12,G2,'Tekis tezlanuvchan harakatlanayotgan jism tezlanishini aniqlash (1-laboratoriya ishi)',[
[`Ishning maqsadi va kerakli jihozlar`,`<b>Maqsad:</b> qiya tarnovdan dumalayotgan sharning tezlanishini a = 2s / t² formuladan aniqlash. <b>Jihozlar:</b> qiya tarnov, shar, sekundomer, o‘lchov lentasi, shtativ.`,`Sirg‘anchiqdan tushayotgan bolaning tezlanishini ham shu usulda baholash mumkin.`,'accg',{v0:0,a:1.5}],
[`Tajriba o‘tkazish tartibi va o‘lchashlar`,`1) Tarnovni qiya o‘rnating. 2) Yo‘l s ni o‘lchang. 3) Sharni qo‘yib yuborib, t vaqtni 3 marta o‘lchang. 4) t ning o‘rtachasini toping. 5) a = 2s/t² ni hisoblang. 6) Xatolikni baholang (Ilovaga qarang).`,`Shu usul zavodlarda konveyer yoki vagonetkalar tezlanishini sinashda ham qo‘llanadi.`,'acc',{v0:0,a:1.5}]
],['Boshlang‘ich tezliksiz harakatda tezlanish qanday topiladi?',['a = 2s/t²','a = s·t','a = s/t'],0]);

L(13,G2,'Jismlarning erkin tushishi',[
[`Erkin tushish hodisasi va uning o‘ziga xosligi`,`Faqat Yerning tortish kuchi ta’sirida tushish — <b>erkin tushish</b> (havo qarshiligi hisobga olinmaydi). Galiley: vakuumda og‘ir va yengil jismlar bir vaqtda tushadi. «Havo qarshiligi» ni yoqib qarang!`,`1971-yilda Oyda astronavt bolg‘a va patni bir vaqtda qo‘yib yuborgan — ikkalasi bir vaqtda tushgan.`,'fall',{air:1}],
[`Erkin tushish tezlanishi`,`Erkin tushish tezlanishi <b>g ≈ 9,8 m/s²</b> (hisoblashlarda ≈ 10). Formulalar: v = g·t, h = g t²/2. Sayyoralarda g turlicha: Oyda 1,6; Marsda 3,7 m/s².`,`Oyda sakrash Yerdagidan ancha baland chiqadi — chunki g kichik.`,'gsim']
],['Yerda erkin tushish tezlanishi taxminan nechaga teng?',['9,8 m/s²','1,6 m/s²','98 m/s²'],0]);

L(14,G2,'Yuqoriga tik otilgan jismning harakati',[
[`Yuqoriga otilgan jism tezligining o‘zgarishi`,`Tik yuqoriga otilgan jismning tezlanishi g, pastga yo‘nalgan. Tezlik <b>v = v₀ − g t</b>: kamayib, eng yuqori nuqtada nolga teng bo‘ladi, so‘ng pastga qarab ortadi.`,`Basketbolchi to‘pni yuqoriga otganda to‘p eng baland nuqtada bir lahza to‘xtab, qaytadi.`,'up'],
[`Ko‘tarilish balandligi va vaqtini aniqlash`,`Ko‘tarilish vaqti <b>t = v₀ / g</b>; maksimal balandlik <b>H = v₀² / (2g)</b>; umumiy uchish vaqti 2v₀/g. Qaytib kelganda tezlik moduli v₀ ga teng.`,`Fontandagi suv 20 m/s tezlik bilan otilsa, taxminan 20 m ga ko‘tariladi.`,'up',{v0:30}]
],['Eng yuqori nuqtada tezlik nimaga teng?',['0','g','v₀'],0]);

L(15,G3,'Jismning tekis aylanma harakati',[
[`Tekis aylanma harakat tushunchasi va uning xarakteristikalari`,`Trayektoriyasi aylana bo‘lgan harakat. Tekis aylanma harakatda tezlik moduli o‘zgarmaydi, lekin <b>yo‘nalishi</b> uzluksiz o‘zgaradi — shu sababli u tezlanishli harakat.`,`Karusel, soat strelkasi, mashina g‘ildiragi — tekis aylanma harakat misollari.`,'circ'],
[`Aylanish davri va chastotasi`,`<b>Davr T</b> — bir marta to‘liq aylanish vaqti (s). <b>Chastota ν</b> — 1 sekundda aylanishlar soni (Hz): <b>ν = 1 / T = N / t</b>.`,`Soatning sekund strelkasi uchun T = 60 s; dvigatelning 3000 ayl/min i = 50 Hz.`,'circ',{R:2,Tp:2}]
],['Davr va chastota orasidagi bog‘lanish qanday?',['ν = 1/T','ν = T','ν = T²'],0]);

L(16,G3,'Aylanma harakatni tavsiflaydigan kattaliklar orasidagi munosabatlar',[
[`Chiziqli tezlik bilan burchak tezlik orasidagi munosabat`,`Burchak tezlik <b>ω = φ / t</b> (rad/s). Chiziqli tezlik bilan bog‘lanish: <b>v = ω · R</b>. Radius katta bo‘lsa, chiziqli tezlik katta, burchak tezlik esa bir xil.`,`Karusel chetidagi bola markazga yaqin bolaga qaraganda tezroq harakatlanadi.`,'circ2'],
[`Aylanish davri, chastota va burchak tezlik bog‘liqligi`,`<b>ω = 2π / T = 2π ν</b>; <b>v = 2πR / T = 2πR ν</b>.`,`Yer o‘z o‘qi atrofida T = 24 soatda aylanadi; ekvatordagi nuqtalarning tezligi ≈ 465 m/s.`,'circ',{R:3,Tp:3}]
],['Chiziqli tezlik formulasi?',['v = ωR','v = ω/R','v = R/ω'],0]);

L(17,G3,'Markazga intilma tezlanish',[
[`Markazga intilma tezlanish tushunchasi va uning fizik ma’nosi`,`Tekis aylanma harakatda tezlanish aylana markaziga yo‘nalgan — <b>markazga intilma tezlanish</b>. U tezlikning faqat yo‘nalishini o‘zgartiradi, modulini emas.`,`Burilishda mashina tashqariga «siljigandek» bo‘ladi — bu inersiya; haqiqiy tezlanish esa markazga qaragan.`,'centr'],
[`Formula va unga doir misollar`,`<b>a = v² / R = ω² R = 4π² R / T²</b>. Misol: v = 10 m/s, R = 5 m bo‘lsa, a = 100/5 = 20 m/s².`,`Velotrekda burilish radiusi katta qilib quriladi — shunda tezlanish kichik bo‘ladi.`,'centr',{v:8,R:2}]
],['Markazga intilma tezlanish qayerga yo‘nalgan?',['Aylana markaziga','Urinma bo‘ylab','Aylanadan tashqariga'],0]);
L(18,G4,'Jismning o‘zaro ta’siri. Kuch',[
[`Jismlarning o‘zaro ta’sir etish xususiyati`,`Jismlar bir-biriga ta’sir qilganda ikkalasining ham tezligi o‘zgaradi: ta’sir <b>o‘zaro</b> bo‘ladi. Chap va o‘ng aravachani itarishda ikkalasi ham harakatga keladi.`,`Qayiqdan sohilga sakraganda qayiq orqaga suriladi — o‘zaro ta’sirning oddiy namunasi.`,'n3',{m1:3,m2:3}],
[`Kuch — jismga boshqa jismning ta’sir o‘lchovi`,`<b>Kuch</b> — vektor kattalik, birligi <b>nyuton (N)</b>. Kuch jism tezligini yoki shaklini o‘zgartiradi. Bir necha kuch ta’sirida teng ta’sir etuvchi R = F₁ + F₂ (vektor yig‘indi) topiladi.`,`Arqon tortish musobaqasida yutuq teng ta’sir etuvchi kuchi katta jamoaga tegadi.`,'fma',{F1:20,F2:0}]
],['Kuch birligi qanday?',['Nyuton (N)','Joul (J)','Vatt (W)'],0]);

L(19,G4,'Nyutonning birinchi qonuni — inersiya qonuni',[
[`Inersiya va inersial sanoq sistemalari`,`<b>Inersiya</b> — jismning tezligini saqlab qolish xususiyati. Boshqa jismlar ta’sir etmasa, jism tinch yoki tekis harakatda qoladi. Ana shunday qonun bajariladigan sanoq sistemalari <b>inersial</b> sanoq sistemalari deyiladi.`,`Avtobus keskin tormozlanganda yo‘lovchilar oldinga yiqiladi: tana oldingi tezligini saqlashga intiladi.`,'inertia'],
[`Nyutonning birinchi qonuni ta’rifi`,`Nyuton 1-qonuni: boshqa jismlar ta’sir etmasa (yoki ta’sirlar o‘zaro muvozanatlashsa), jism tinch yoki to‘g‘ri chiziqli tekis harakatda bo‘ladi. Ishqalanish 0 bo‘lsa, shar tezligini abadiy saqlaydi.`,`Muz ustida sirpanayotgan shayba ishqalanish kam bo‘lgani uchun uzoq vaqt harakatlanadi.`,'inertia',{mu:0,v:6}]
],['Inersiya nima?',['Tezlikni saqlash xususiyati','Kuch turi','Tezlanish birligi'],0]);

L(20,G4,'Jism massasi',[
[`Massa — jismning inertlik o‘lchovi`,`<b>Massa m</b> — jismning inertligini o‘lchaydi: massa katta bo‘lsa, tezligini o‘zgartirish qiyin. Bir xil kuch ta’sirida kichik massali jism ko‘proq tezlik oladi.`,`Bo‘sh aravachani itarish oson, yuk to‘la aravachani itarish qiyin.`,'n3',{m1:1,m2:8}],
[`Massaning saqlanish qonuni va o‘lchov birliklari`,`Massa SI da <b>kilogramm (kg)</b> bilan o‘lchanadi (1 t = 1000 kg, 1 kg = 1000 g). Massa jism qayerda bo‘lishidan qat’i nazar o‘zgarmaydi: Yerda ham, Oyda ham bir xil.`,`Tarozida 1 kg guruch Oyga olib borilsa ham, uning massasi 1 kg ligicha qoladi.`,'scale',{m:10,pl:1}]
],['Massaning SI dagi birligi?',['Kilogramm','Nyuton','Litr'],0]);

L(21,G4,'Nyutonning ikkinchi qonuni',[
[`Kuch, massa va tezlanish orasidagi bog‘liqlik`,`Tezlanish ta’sir etuvchi kuchga <b>to‘g‘ri</b>, massaga esa <b>teskari</b> proporsional: kuch 2 marta ortsa, tezlanish 2 marta ortadi; massa 2 marta ortsa, tezlanish 2 marta kamayadi.`,`Bir xil kuch bilan yengil velosipedni ham, og‘ir mototsiklni ham itarib ko‘ring: velosiped tezroq tezlashadi.`,'fma'],
[`Nyutonning ikkinchi qonuni formulasi va uning tahlili`,`<b>a = F / m</b> yoki <b>F = m·a</b>; F — teng ta’sir etuvchi kuch. 1 N — 1 kg massali jismga 1 m/s² tezlanish beruvchi kuch. Tezlanish yo‘nalishi kuch yo‘nalishi bilan bir xil.`,`Raketa dvigateli kuchi katta, massa kam bo‘lsa, tezlanish katta bo‘ladi.`,'fma',{F1:30,F2:10,m:5}]
],['Nyuton 2-qonuni formulasi?',['F = ma','F = m/a','F = a/m'],0]);

L(22,G4,'Nyutonning uchinchi qonuni',[
[`Ta’sir va aks ta’sir kuchlari`,`Jismlar bir-biriga <b>teng va qarama-qarshi</b> kuchlar bilan ta’sir qiladi: F₁₂ = −F₂₁. Bu kuchlar <b>turli jismlarga</b> qo‘yilgani uchun bir-birini muvozanatlamaydi.`,`Devorni itarsangiz, devor ham sizni teng kuch bilan itaradi.`,'n3',{m1:3,m2:3}],
[`Nyutonning uchinchi qonunining mazmuni`,`Ta’sir kuchlari bir xil tabiatli, bir to‘g‘ri chiziq bo‘ylab yo‘nalgan. Kuchlar teng bo‘lsa-da, tezlanishlar massalarga qarab turlicha: a₁/a₂ = m₂/m₁.`,`Qayiqdagi odam sohilni itarsa, yengil qayiq tez, og‘ir kema esa deyarli sezilmaydigan darajada harakatlanadi.`,'n3',{m1:1,m2:9}]
],['F₁₂ va F₂₁ qanday?',['Teng va qarama-qarshi','Teng va bir xil yo‘nalgan','Har xil'],0]);

L(23,G4,'Harakat qonunlarining aylanma harakatga tatbiqi',[
[`Aylanma harakatdagi dinamik qonuniyatlar`,`Aylanma harakat uchun ham Nyuton qonunlari o‘rinli: tezlanish markazga yo‘nalgan, shuning uchun jismga markazga tomon yo‘nalgan kuch ta’sir etishi kerak.`,`Mashina burilishida g‘ildirak va yo‘l orasidagi ishqalanish kuchi uni aylana bo‘ylab ushlab turadi.`,'centr',{cut:0}],
[`Markazga intilma kuch tushunchasi`,`<b>F = m·a = m v² / R</b>. Bu kuch yangi tabiatli kuch emas, balki ip taranglik, ishqalanish yoki tortishish kuchlarining natijasi. Ip uzilsa, jism urinma bo‘ylab uchib ketadi.`,`Sportchi bolg‘ani aylantirib otganda, qo‘yib yuborish paytida bolg‘a urinma bo‘ylab uchadi.`,'centr',{cut:1}]
],['Ip uzilsa, aylanayotgan jism qayerga uchadi?',['Urinma bo‘ylab','Markazga','Radius bo‘ylab tashqariga'],0]);

L(24,G4,'Elastiklik kuchi',[
[`Jismlarning deformatsiyasi (elastik va qoldiq deformatsiya)`,`<b>Deformatsiya</b> — jism shakli yoki o‘lchamining o‘zgarishi. Kuch olingach jism avvalgi holatiga qaytsa — <b>elastik</b>, qaytmasa — <b>qoldiq (plastik)</b> deformatsiya.`,`Rezina va prujina elastik; plastilin yoki egilib qolgan mix — qoldiq deformatsiya.`,'hooke',{m:4,k:100}],
[`Guk qonuni va uning formulasi`,`Elastiklik kuchi deformatsiyaga to‘g‘ri proporsional: <b>F = k·x</b>, k — bikrlik (N/m), x — uzayish. Kuch deformatsiyaga qarama-qarshi yo‘nalgan.`,`Dinamometr va avtomobil amortizatori Guk qonuniga asoslangan.`,'hooke',{m:1,k:100}]
],['Guk qonuni formulasi?',['F = kx','F = mg','F = ma'],0]);

L(25,G4,'Prujina bikrligini aniqlash (2-laboratoriya ishi)',[
[`Laboratoriya ishining maqsadi va jihozlari`,`<b>Maqsad:</b> prujina bikrligi k ni aniqlash. <b>Jihozlar:</b> shtativ, prujina, 100 g li yuklar to‘plami, o‘lchov lentasi (chizg‘ich).`,`Mashina ressorlarining bikrligi shu usulda tekshiriladi.`,'springLab'],
[`Tajribani bajarish tartibi va xatoliklarni hisoblash`,`1) Prujinani osib, uzunligini o‘lchang. 2) Yuk osib, x uzayishni o‘lchang. 3) F = mg ni hisoblang. 4) k = F/x ni har bir yuk uchun toping. 5) k ning o‘rtachasi va xatoligini hisoblang.`,`Yuklar sonini oshirish o‘lchash xatoligini kamaytiradi.`,'springLab',{n:6,k:80}]
],['Bikrlik qanday topiladi?',['k = F/x','k = Fx','k = x/F'],0]);

L(26,G5,'Butun olam tortishish qonuni',[
[`Gravitatsion o‘zaro ta’sir va Nyutonning butun olam tortishish qonuni`,`Har qanday ikki jism bir-birini tortadi: <b>F = G·m₁m₂ / r²</b>. Kuch massalar ko‘paytmasiga to‘g‘ri, masofa kvadratiga teskari proporsional.`,`Oy Yerni tortgani uchun okeanlarda suv ko‘tarilishi va qaytishi (to‘lqin) yuz beradi.`,'gravity'],
[`Gravitatsiya doimiysi va uning fizik ma’nosi`,`<b>G = 6,67·10⁻¹¹ N·m²/kg²</b> — massalari 1 kg bo‘lgan ikki jism 1 m masofada shuncha kuch bilan tortishadi. U juda kichik, shuning uchun kundalik jismlar orasida sezilmaydi.`,`Ikki talaba orasidagi tortishish kuchi juda kichik; lekin Yer kabi katta massa bilan esa sezilarli.`,'gconst']
],['Masofa 2 marta ortsa, tortishish kuchi qanday o‘zgaradi?',['4 marta kamayadi','2 marta kamayadi','4 marta ortadi'],0]);

L(27,G5,'Og‘irlik kuchi',[
[`Yerning jismlarni tortish kuchi`,`Yer jismni o‘ziga tortadi. Bu <b>og‘irlik kuchi</b> deyiladi va vertikal pastga yo‘nalgan: <b>F = m·g</b>. Yer sirti yaqinida g ≈ 9,8 m/s².`,`Olma shoxdan uzilganda pastga tushadi — Yer uni tortadi.`,'scale',{pl:0}],
[`Erkin tushish tezlanishi va og‘irlik kuchini hisoblash`,`g ≈ 9,8 m/s² (masalalarda 10). Misol: m = 5 kg → F = 5·9,8 = 49 N. Oyda g = 1,6 m/s², shuning uchun F kichik.`,`70 kg astronavtning og‘irlik kuchi Yerda ≈ 686 N, Oyda atigi ≈ 112 N.`,'scale',{m:70,pl:1}]
],['m = 10 kg jismga ta’sir etuvchi og‘irlik kuchi (g = 10)?',['100 N','10 N','1 N'],0]);

L(28,G5,'Jismning og‘irligi',[
[`Og‘irlik tushunchasi va uning og‘irlik kuchidan farqi`,`<b>Og‘irlik P</b> — jismning tayanch yoki osmaga ta’sir kuchi; tayanch/osma tomonidan jismga ta’sir (reaksiya) bilan teng. Og‘irlik kuchi Yer tomonidan jismga, og‘irlik esa jism tomonidan tayanchga qo‘yiladi. Tinch yoki tekis harakatda P = mg.`,`Tarozida turganingizda tarozi sizning og‘irligingizni ko‘rsatadi, massangizni emas.`,'scale',{m:60,pl:0}],
[`Tayanch yoki osmaga ko‘rsatiladigan ta’sir`,`Jism tezlanish bilan harakatlansa, og‘irlik o‘zgaradi: <b>P = m(g + a)</b>, a yuqoriga yo‘nalsa «+», pastga — «−».`,`Lift yuqoriga tez ko‘tarilganda oyoqlaringiz ostidagi bosim ortganini sezasiz.`,'lift',{a:0}]
],['Tekis harakatlanayotgan jismning og‘irligi?',['P = mg','P = 0','P = m/g'],0]);

L(29,G5,'Yuklama va vaznsizlik',[
[`Liftda va transportda harakatlanishdagi vazn o‘zgarishlari`,`Lift yuqoriga <b>tezlanish</b> bilan harakatlansa, P = m(g + a) &gt; mg — og‘irlik ortadi. Pastga tezlanish bilan harakatlansa P = m(g − a) kamayadi.`,`Pastga tez tushayotgan liftda ichingiz «bo‘shab» ketgandek bo‘ladi.`,'lift',{a:2}],
[`Vaznsizlik va ortiqcha yuklanish (overload)`,`Jism faqat tortishish ta’sirida erkin tushsa (a = g pastga), P = 0 — <b>vaznsizlik</b>. Raketa uchishida tezlanish katta bo‘lib, <b>yuklama</b> (ortiqcha yuklanish) vujudga keladi: P ≫ mg.`,`Xalqaro kosmik stansiyadagi astronavtlar vaznsiz — ular Yer atrofida erkin tushmoqda.`,'lift',{a:-10}]
],['Vaznsizlikda og‘irlik nimaga teng?',['0','mg','2mg'],0]);

L(30,G5,'Yerning tortish kuchi ta’sirida jismlarning harakati',[
[`Tik yuqoriga otilgan va erkin tushayotgan jismlar harakati`,`Ikkala holda ham a = g pastga yo‘nalgan. Yuqoriga: v = v₀ − gt, h = v₀t − gt²/2. Pastga: v = gt, h = gt²/2.`,`Mevani silkitgan daraxtdan tushish yoki to‘pni yuqoriga otish — bir xil qonun bilan.`,'up',{v0:15}],
[`Gorizontal yo‘nalishda otilgan jism harakati`,`Harakat ikki qismga ajraladi: gorizontal — tekis (v₀ = const), vertikal — erkin tushish. Vaqt <b>t = √(2h/g)</b>, uchish uzoqligi <b>l = v₀·t</b>.`,`Stol chetidan tushayotgan to‘p yoki samolyotdan tashlangan yuk parabola bo‘ylab uchadi.`,'proj']
],['Gorizontal otilgan jismning gorizontal tezligi?',['O‘zgarmaydi','Ortadi','Kamayadi'],0]);

L(31,G5,'Yer sun’iy yo‘ldoshlari',[
[`Birinchi kosmik tezlik va uning qiymati`,`Jism Yer sirti yaqinida aylana orbita bo‘ylab harakatlanishi uchun gorizontal tezlik <b>v₁ = √(gR) ≈ 7,9 km/s</b> bo‘lishi kerak. 11,2 km/s dan katta bo‘lsa, jism Yerdan butunlay ketadi (ikkinchi kosmik tezlik).`,`1957-yilda birinchi sun’iy yo‘ldosh «Sputnik-1» shu tezlikka yaqin tezlik bilan orbitaga chiqarilgan.`,'sat'],
[`Yer sun’iy yo‘ldoshlarining harakat qonuniyatlari`,`Yo‘ldosh Yer atrofida tortishish kuchi ta’sirida aylanadi: <b>v = √(GM/r)</b>. Orbita qancha baland bo‘lsa, tezlik kichik, davr katta. Geostatsionar yo‘ldosh davri 24 soat.`,`GPS va telefon aloqasi, ob-havo kuzatuvi sun’iy yo‘ldoshlar yordamida ishlaydi.`,'satT']
],['Birinchi kosmik tezlik taxminan?',['7,9 km/s','11,2 km/s','340 m/s'],0]);

L(32,G5,'Ishqalanish kuchi. Tinchlikdagi ishqalanish',[
[`Ishqalanish kuchining kelib chiqish sabablari`,`Ishqalanish — tegib turgan jismlar sirtidagi g‘adir-budirlik va molekulyar tortishish natijasi. Ishqalanish kuchi harakatga qarshi yo‘nalgan.`,`Muzda yurish qiyin — chunki ishqalanish kam.`,'fr',{F:30}],
[`Tinchlikdagi ishqalanish kuchi va uning xususiyatlari`,`Tashqi kuch bilan jismni qo‘zg‘atishga urinsak, <b>tinchlikdagi ishqalanish</b> tashqi kuchga teng bo‘lib, uni muvozanatlaydi. Eng katta qiymati <b>F max = μN</b>. Kuch shu qiymatdan oshgandagina jism harakatlana boshlaydi.`,`Og‘ir shkafni ozgina itarsangiz, u qo‘zg‘almaydi — tinchlikdagi ishqalanish kuchingizga teng.`,'fr',{F:10}]
],['Jism qo‘zg‘almay turganda ishqalanish kuchi nimaga teng?',['Tashqi kuchga','Nolga','μN ga doim'],0]);

L(33,G5,'Sirpanish ishqalanishi. Dumalash ishqalanish',[
[`Sirpanish ishqalanish kuchining formulasi`,`<b>F ish = μ · N</b>, bunda μ — sirpanish ishqalanish koeffitsiyenti (sirt turiga bog‘liq), N — tayanchning reaksiya kuchi. Gorizontal sirtda N = mg.`,`Rezina yo‘l bilan ishqalanishi katta (μ ≈ 0,7), muz bilan juda kichik (μ ≈ 0,02–0,1).`,'fr',{F:50,m:5}],
[`Dumalash ishqalanishining sirpanishdan farqi`,`Dumalashda ishqalanish kuchi sirpanishdagidan <b>ancha kichik</b> (bir necha 10 marta). Shuning uchun og‘ir yuklarni g‘ildirakli aravada tashish oson.`,`Chamadonning g‘ildiragi tufayli uni tortish oson.`,'rollsl']
],['Qaysi ishqalanish kuchi kichikroq?',['Dumalash','Sirpanish','Ikkalasi teng'],0]);

L(34,G5,'Sirpanish ishqalanish koeffitsiyentini aniqlash (3-laboratoriya ishi)',[
[`Ishning maqsadi va kerakli jihozlar`,`<b>Maqsad:</b> μ ni aniqlash. <b>Jihozlar:</b> yog‘och brusok, dinamometr, yuklar, tekis taxta, tarozi.`,`Avtomobil shinasining yo‘l bilan ishqalanishi shu usulda sinaladi.`,'frlab'],
[`Tajriba o‘tkazish metodikasi va hisob-kitoblar`,`1) Brusokning massasini o‘lchang va N = mg ni toping. 2) Dinamometr bilan brusokni tekis tortib, F ni o‘lchang. 3) <b>μ = F / N</b> ni hisoblang. 4) Yukni o‘zgartirib tajribani takrorlang, μ o‘rtachasini toping.`,`Qor, muz va asfalt uchun μ boshqa-boshqa — shuning uchun qishda tormozlash yo‘li uzayadi.`,'frlab',{load:400,sf:2}]
],['μ qanday topiladi?',['μ = F/N','μ = F·N','μ = N/F'],0]);

L(35,G5,'Tabiatda va texnikada ishqalanish',[
[`Ishqalanishning foydali va zararli tomonlari`,`Foydali: yurish, tormozlash, mix va vint mustahkamligi. Zararli: mashina detallarining yeyilishi va qizishi, energiya isrofi.`,`Ishqalanishsiz mashina tormozlanmas edi, kiyim va bog‘ichlar yechilib ketar edi.`,'brake',{sf:2}],
[`Ishqalanishni kamaytirish va oshirish usullari`,`Kamaytirish: moylash, g‘ildirak va podshipnik, silliqlash. Oshirish: g‘adir-budir sirt, shinadagi protektor, qum sepish.`,`Muzli yo‘lga qum sepish ishqalanishni oshirib, to‘xtash yo‘lini qisqartiradi.`,'brake',{sf:0}]
],['Ishqalanishni kamaytirish usuli qaysi?',['Moylash','Qum sepish','Sirtni g‘adir-budir qilish'],0]);

L(36,G6,'Impuls',[
[`Jism impulsi (harakat miqdori) tushunchasi`,`<b>Jism impulsi p = m·v</b> — vektor kattalik (kg·m/s), yo‘nalishi tezlik yo‘nalishi bilan bir xil. Massa va tezlik katta bo‘lsa, impuls ham katta.`,`Yuk mashinasini to‘xtatish yengil mashinadan qiyin — impulsi katta.`,'mom',{m1:2,v1:4,m2:2,v2:-4}],
[`Kuch impulsi va uning fizik ma’nosi`,`<b>Kuch impulsi F·Δt = m·Δv</b> — jism impulsining o‘zgarishiga teng. Kuch uzoqroq ta’sir etsa, tezlik ko‘proq o‘zgaradi.`,`Havo yostig‘i (airbag) to‘qnashuv vaqtini cho‘zadi, kuchni kamaytiradi. Futbolchi to‘pni uzoqroq «kuzatib» tepsa, zarba kuchliroq.`,'impulse']
],['Jism impulsi formulasi?',['p = mv','p = ma','p = F/t'],0]);

L(37,G6,'Impulsning saqlanish qonuni',[
[`Berk sistema tushunchasi`,`<b>Berk (yopiq) sistema</b> — tashqi kuchlar ta’sir etmaydigan (yoki ular muvozanatlashgan) jismlar sistemasi. Faqat sistema ichidagi jismlar o‘zaro ta’sirlashadi.`,`Muz ustidagi ikki konkida uchuvchi bir-birini itarishi ideal berk sistema (ishqalanish kichik).`,'n3',{m1:2,m2:2}],
[`Impulsning saqlanish qonuni va uning qo‘llanilishi`,`Berk sistemada o‘zaro ta’sirgacha va undan keyingi impulslar yig‘indisi teng: <b>m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′</b>. Qonun to‘qnashuvlar, portlashlar va otishda qo‘llanadi.`,`Bilyard sharlarining to‘qnashuvi, ov miltig‘ining orqaga tepishi (otdi) — impulsning saqlanishi.`,'mom',{m1:2,v1:5,m2:3,v2:-2,ty:0}]
],['Berk sistemada nima saqlanadi?',['Umumiy impuls','Umumiy tezlik','Har bir jism tezligi'],0]);

L(38,G6,'Reaktiv harakat',[
[`Reaktiv harakat tushunchasi va asosiy qonuniyatlari`,`Jismning bir qismi biror tezlik bilan ajralib chiqsa, qolgan qismi teskari yo‘nalishda harakatlanadi — <b>reaktiv harakat</b>. Impulsning saqlanishiga ko‘ra: <b>m<sub>r</sub>·v = m<sub>g</sub>·u</b>.`,`Havo bilan to‘ldirilgan va qo‘yib yuborilgan sharcha ichidagi havo orqaga chiqib, o‘zi oldinga uchadi.`,'rocket'],
[`Raketa texnikasi va tabiatdagi reaktiv harakatlar`,`Raketa yoqilg‘i yonib, gazni katta tezlik bilan pastga otadi — o‘zi yuqoriga uchadi (Siolkovskiy). Tabiatda: kalmar, meduza va sakkizoyoq suvni itarib harakatlanadi.`,`Kosmik raketalar, kemalar va reaktiv samolyotlar shu tamoyil bilan ishlaydi.`,'rocket',{mg:3,u:2000,mr:5}]
],['Reaktiv harakat nimaga asoslangan?',['Impulsning saqlanishi','Ishqalanish','Guk qonuni'],0]);

L(39,G7,'Mexanik ish',[
[`Mexanik ish tushunchasi va uning formulasi`,`Kuch ta’sirida jism ko‘chsa, <b>mexanik ish</b> bajariladi: <b>A = F·s·cos α</b>. Kuch va ko‘chish bir yo‘nalishda (α = 0) bo‘lsa A = F·s; kuch ko‘chishga tik bo‘lsa, A = 0.`,`Chamadonni gorizontal ko‘tarib yursangiz (kuch tik, ko‘chish gorizontal), fizik nuqtai nazardan ish bajarilmaydi!`,'work'],
[`Ishning o‘lchov birliklari`,`SI da ish birligi <b>joul (J)</b>: 1 J = 1 N·m — 1 N kuch ta’sirida jism 1 m ko‘chganda bajarilgan ish. 1 kJ = 1000 J.`,`1 kg yukni 1 m ko‘tarishda ≈ 10 J ish bajariladi.`,'work',{al:60,F:50,s:10}]
],['Ish birligi qanday?',['Joul','Nyuton','Vatt'],0]);

L(40,G7,'Jismni ko‘tarishda va shu masofaga gorizontal ko‘chirishda bajarilgan ishni hisoblash (4-laboratoriya ishi)',[
[`Laboratoriya ishining maqsadi va jihozlari`,`<b>Maqsad:</b> jismni ko‘tarishda va gorizontal ko‘chirishda bajarilgan ishlarni hisoblash va solishtirish. <b>Jihozlar:</b> dinamometr, brusok, o‘lchov lentasi, shtativ.`,`Omborchi yukni ko‘tarishda ko‘proq charchaydi — bu ishning katta bo‘lishini bildiradi.`,'workLab'],
[`Tajribani bajarish va natijalarni tahlil qilish`,`1) Dinamometr bilan jism og‘irligini o‘lchang va h balandlikka ko‘taring: A₁ = F₁·h. 2) Jismni stol bo‘ylab tekis tortib F₂ ni o‘lchang: A₂ = F₂·s. 3) A₁ va A₂ ni solishtiring: odatda A₂ &lt; A₁.`,`Og‘ir yukni arava bilan yuritish ko‘tarishdan ancha yengil — ish kam.`,'workLab',{m:1,h:0.8,s:0.8}]
],['Ko‘tarishda bajarilgan ish?',['A = mgh','A = F·t','A = μN'],0]);

L(41,G7,'Potensial energiya',[
[`O‘zaro ta’sirlashuvchi jismlarning energiyasi`,`<b>Potensial energiya</b> — o‘zaro ta’sirlashayotgan jismlarning (yoki jism qismlarining) o‘zaro joylashuviga bog‘liq energiya. Birligi — joul (J).`,`Suv ombori balandda to‘plangan suv potensial energiyaga ega — u pastga tushib turbinani aylantiradi.`,'pe'],
[`Og‘irlik kuchi va elastik deformatsiyalangan jism potensial energiyasi`,`Yerdan h balandlikdagi jism: <b>E<sub>p</sub> = m·g·h</b>. Deformatsiyalangan prujina: <b>E<sub>p</sub> = k·x² / 2</b>.`,`Kamon yoyi tortilganda energiya to‘planadi va o‘q uchganda kinetik energiyaga aylanadi.`,'pek']
],['Balandlikdagi jismning potensial energiyasi?',['mgh','mv²/2','kx'],0]);

L(42,G7,'Kinetik energiya',[
[`Harakatdagi jism energiyasi`,`Harakatdagi jism boshqa jismni siljita oladi, ya’ni <b>kinetik energiyaga</b> ega. Tezlik va massa qancha katta bo‘lsa, kinetik energiya shuncha katta.`,`Shamol turbinalari havo harakatining kinetik energiyasidan foydalanadi.`,'ke'],
[`Kinetik energiya formulasi`,`<b>E<sub>k</sub> = m·v² / 2</b>. Tezlik 2 marta ortsa, kinetik energiya 4 marta ortadi — shuning uchun yuqori tezlikda to‘qnashuv xavfliroq.`,`Yo‘lda tezlikni oshirsangiz, to‘xtash yo‘li ham kvadratik oshadi.`,'ke',{m:4,v:6}]
],['Tezlik 2 marta ortsa E_k necha marta ortadi?',['4','2','8'],0]);

L(43,G7,'Mexanik energiyaning saqlanish qonuni',[
[`To‘la mexanik energiya tushunchasi`,`<b>To‘la mexanik energiya</b> = potensial + kinetik: <b>E = E<sub>p</sub> + E<sub>k</sub></b>. Ishqalanishsiz tushayotgan jismda E doimiy.`,`Tepalikdan tushayotgan velosipedchi: balandlik kamayadi — tezlik ortadi.`,'efall'],
[`Energiyaning saqlanish va bir turdan ikkinchi turga o‘tish qonuni`,`Ishqalanish va qarshilik bo‘lmasa, <b>E<sub>p</sub> + E<sub>k</sub> = const</b>. Energiya yo‘qolmaydi, faqat bir turdan boshqasiga o‘tadi: mayatnikda E<sub>p</sub> ⇄ E<sub>k</sub>, qiyalikdan tushishda E<sub>p</sub> → E<sub>k</sub>.`,`Attraksion «amerikan tepaligi»: eng baland nuqtada E<sub>p</sub> katta, pastda E<sub>k</sub> katta; yig‘indi o‘zgarmaydi.`,'coaster']
],['Ishqalanishsiz E_p + E_k nima bo‘ladi?',['O‘zgarmaydi','Ortadi','Kamayadi'],0]);

L(44,G7,'Jism kinetik energiyasining uning tezligi va massasiga bog‘liqligini aniqlash (5-laboratoriya ishi)',[
[`Ishning maqsadi va zarur jihozlar`,`<b>Maqsad:</b> E<sub>k</sub> ning m va v ga bog‘liqligini aniqlash. <b>Jihozlar:</b> qiya tarnov, turli massali sharlar, brusok, o‘lchov lentasi, shtativ.`,`Yo‘l qurilishida og‘ir va tez harakatlanuvchi mashinalar energiyasi katta, shuning uchun ularni to‘xtatish qiyin.`,'kelab'],
[`Tajriba o‘tkazish tartibi va xatoliklarni hisoblash`,`1) Shar balandligini h o‘zgartirib (tezlik o‘zgaradi) blok siljishi s ni o‘lchang. 2) Massani o‘zgartirib tajribani takrorlang. 3) s ∝ E<sub>k</sub> = mv²/2 ekanini aniqlang. 4) Xatolikni hisoblang.`,`Qancha baland joydan otilsa, zarba shuncha kuchli bo‘ladi.`,'kelab',{h:0.6,mb:100}]
],['E_k kimga to‘g‘ri proporsional?',['m va v²','v','m/v'],0]);

L(45,G7,'Quvvat',[
[`Quvvat tushunchasi va uning o‘lchov birliklari`,`<b>Quvvat N = A / t</b> — ishning bajarilish tezligi. SI da birligi <b>vatt (W)</b>: 1 W = 1 J/s. 1 kW = 1000 W; 1 ot kuchi ≈ 736 W.`,`Elektr lampochkasi 60 W — har sekundda 60 J energiya sarflaydi.`,'power'],
[`Ish bajarish tezligi`,`Bir xil ishni kam vaqtda bajargan mexanizmning quvvati katta. <b>A = N·t</b>. Tekis harakatda N = F·v.`,`Kran yukni 5 s da ko‘tarsa, 10 s da ko‘targanidan ikki marta quvvatliroq.`,'power',{tA:3,tB:6}]
],['1 vatt nimaga teng?',['1 J/s','1 N·m','1 kg·m/s'],0]);

L(46,G7,'Tabiatda energiyaning saqlanishi. Foydali ish koeffitsiyenti',[
[`Energiyaning saqlanish qonunining umumiy xarakteri`,`Energiya yo‘qolmaydi va yo‘qdan paydo bo‘lmaydi, faqat bir turdan boshqasiga o‘tadi. Ishqalanish bo‘lsa, mexanik energiyaning bir qismi issiqlik energiyasiga aylanadi, lekin umumiy energiya saqlanadi.`,`Qo‘llarni ishqalaganda ular qiziydi — mexanik energiya issiqlikka aylanadi.`,'epend'],
[`Mexanizm va qurilmalarning foydali ish koeffitsiyenti (FIK)`,`<b>η = A<sub>foydali</sub> / A<sub>to‘liq</sub> · 100 %</b>. FIK har doim 100 % dan kichik, chunki ishqalanish va issiqlik isrof bo‘ladi.`,`Benzinli dvigatel FIK ≈ 25–30 %, elektr dvigatel ≈ 90 %.`,'fik']
],['FIK qanday bo‘lishi mumkin?',['100 % dan kichik','100 % dan katta','Doimo 100 %'],0]);

L('Ilova',G8,'Laboratoriya ishlarida o‘lchash xatoliklarini hisoblash',[
[`Absolyut va nisbiy xatolik`,`O‘lchashda xatolik bo‘ladi. Bir necha o‘lchashning o‘rtacha qiymati <b>x<sub>o‘rt</sub></b>; absolyut xatolik <b>Δx = Δx<sub>o‘rt</sub> + (asbob bo‘lim bahosi / 2)</b>; nisbiy xatolik <b>ε = Δx / x<sub>o‘rt</sub> · 100 %</b>. Natija: x = x<sub>o‘rt</sub> ± Δx.`,`Do‘konda tarozi bir xil tovarni biroz turlicha o‘lchaydi — tarozining aniqligi cheklangan.`,'err'],
[`Aniqlikni oshirish`,`O‘lchashlar soni ko‘paysa va asbobning bo‘lim bahosi kichik bo‘lsa, xatolik kamayadi.`,`Sportda sekundomerning 0,01 s aniqligi g‘olibni aniqlaydi.`,'err',{d:0.2,n:8}]
],['Nisbiy xatolik qanday topiladi?',['ε = Δx / x o‘rt','ε = x · Δx','ε = Δx − x'],0]);
/* ===== YORDAMCHI FUNKSIYALAR ===== */
const P=Math.PI,G=9.8,K={ink:'#1e293b',blue:'#2563eb',red:'#dc2626',green:'#16a34a',amber:'#d97706',gray:'#94a3b8',purple:'#7c3aed',sky:'#e0f2fe',grass:'#d9f99d'};
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const f1=x=>(Math.round(x*100)/100).toString().replace('.',',');
function TX(g,s,x,y,o){o=o||{};g.fillStyle=o.c||K.ink;g.font=(o.b?'bold ':'')+(o.s||13)+'px system-ui,sans-serif';g.textAlign=o.a||'left';g.fillText(s,x,y);}
function LN(g,x1,y1,x2,y2,c,w,d){g.strokeStyle=c||K.ink;g.lineWidth=w||2;g.setLineDash(d||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);}
function AW(g,x1,y1,x2,y2,c,w){c=c||K.red;w=w||3;const d=Math.hypot(x2-x1,y2-y1);if(d<3)return;LN(g,x1,y1,x2,y2,c,w);const a=Math.atan2(y2-y1,x2-x1),s=Math.min(11,d/2);g.fillStyle=c;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));g.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));g.closePath();g.fill();}
function CI(g,x,y,r,f,s){g.beginPath();g.arc(x,y,Math.max(r,0.5),0,2*P);if(f){g.fillStyle=f;g.fill();}if(s){g.strokeStyle=s;g.lineWidth=2;g.stroke();}}
function RC(g,x,y,w,h,f,s){if(f){g.fillStyle=f;g.fillRect(x,y,w,h);}if(s){g.strokeStyle=s;g.lineWidth=2;g.strokeRect(x,y,w,h);}}
function CAR(g,x,y,c,w){w=w||64;c=c||K.blue;RC(g,x,y-24,w,16,c);RC(g,x+w*0.22,y-36,w*0.5,12,c);RC(g,x+w*0.3,y-34,w*0.14,8,'#e0f2fe');RC(g,x+w*0.5,y-34,w*0.14,8,'#e0f2fe');CI(g,x+w*0.2,y-8,8,'#111');CI(g,x+w*0.8,y-8,8,'#111');}
function GND(g,y,W,c){RC(g,0,0,W,y,'#f0f9ff');RC(g,0,y,W,300-y,c||K.grass);LN(g,0,y,W,y,'#65a30d',2);}
function MAN(g,x,y,c){c=c||K.amber;CI(g,x,y-34,6,'#fcd34d',K.ink);LN(g,x,y-28,x,y-12,c,4);LN(g,x,y-12,x-5,y,K.ink,3);LN(g,x,y-12,x+5,y,K.ink,3);LN(g,x-8,y-24,x+8,y-24,c,3);}
function GRAPH(g,x,y,w,h,xm,ym,xl,yl){const X=v=>x+v/xm*w,Y=v=>y+h-v/ym*h;g.strokeStyle='#e2e8f0';g.lineWidth=1;for(let i=1;i<=4;i++){g.beginPath();g.moveTo(x,Y(ym*i/4));g.lineTo(x+w,Y(ym*i/4));g.stroke();g.beginPath();g.moveTo(X(xm*i/4),y);g.lineTo(X(xm*i/4),y+h);g.stroke();}
LN(g,x,y+h,x+w,y+h,K.ink,2);LN(g,x,y+h,x,y,K.ink,2);for(let i=0;i<=4;i++){TX(g,String(+(xm*i/4).toFixed(1)),X(xm*i/4),y+h+14,{a:'center',s:10,c:K.gray});TX(g,String(+(ym*i/4).toFixed(1)),x-4,Y(ym*i/4)+4,{a:'right',s:10,c:K.gray});}
TX(g,xl,x+w,y+h+28,{a:'right',s:11,b:1});TX(g,yl,x+4,y-5,{s:11,b:1});return{X,Y};}
function BAR(g,x,y,w,h,val,max,col,lab){RC(g,x,y,w,h,'#f1f5f9','#cbd5e1');RC(g,x,y+h*(1-cl(val/max,0,1)),w,h*cl(val/max,0,1),col);TX(g,lab,x+w/2,y+h+14,{a:'center',s:11,b:1,c:col});}
const PLAN=[['Yer',9.8],['Oy',1.6],['Mars',3.7],['Yupiter',24.8]];
const SIMS={};

/* ===== KIRISH ===== */
SIMS.phenom={T:8,c:[['k','Hodisa turi (0 mexanik, 1 issiqlik, 2 elektr, 3 yorug‘lik, 4 tovush)',0,4,1,0,''],['q','Intensivlik',1,5,1,3,'']],
d(g,t,p,W,H){const names=['Mexanik hodisa — jism harakati','Issiqlik hodisasi — molekulalar harakati','Elektr hodisasi — zaryadlar oqimi','Yorug‘lik hodisasi — nurning qaytishi','Tovush hodisasi — to‘lqin tarqalishi'];RC(g,0,0,W,H,'#f8fafc');TX(g,names[p.k],20,28,{b:1,s:15});
if(p.k==0){GND(g,220,W);const x=40+((t*p.q*40)%540);CI(g,x,200,20,K.red,K.ink);for(let i=1;i<5;i++)LN(g,x-i*16,200,x-i*16-8,200,K.gray,2);}
else if(p.k==1){RC(g,60,60,300,180,'#fff7ed','#fb923c');for(let i=0;i<24;i++){const a=i*2.4,x=70+((i*53+Math.sin(a+t*p.q)*40+t*p.q*20*(1+i%3))%280),y=70+((i*37+Math.cos(a*1.3+t*p.q)*40+t*p.q*15*(1+i%2))%160);CI(g,x,y,6,'hsl('+(40-p.q*8)+',90%,55%)');}TX(g,'Temperatura '+(20+p.q*20)+' °C',400,100,{b:1});}
else if(p.k==2){LN(g,80,220,560,220,K.ink,3);LN(g,80,80,560,80,K.ink,3);LN(g,80,80,80,220,K.ink,3);LN(g,560,80,560,220,K.ink,3);RC(g,300,70,40,20,'#fde047',K.ink);for(let i=0;i<14;i++){const u=((i/14)+t*p.q*0.06)%1,per=2*(480+140);let d=u*per,x,y;if(d<480){x=80+d;y=220}else if(d<550){x=560;y=220-(d-480)*2}else if(d<1030-70){x=560-(d-550);y=80}else{x=80;y=80+(d-910)*0.9}if(d>=550&&d<910)continue;CI(g,x,y,4,K.blue);}TX(g,'Elektr toki: zaryadlarning tartibli harakati',90,260,{s:12});}
else if(p.k==3){RC(g,0,200,W,6,'#94a3b8');TX(g,'Ko‘zgu',560,225,{s:12});const ang=0.3+p.q*0.18,cx=320;AW(g,cx-200*Math.tan(ang)*1.0-0,200-200,cx,200,K.amber,3);const ph=Math.min(1,(t%4)/1.5);AW(g,cx-200*Math.tan(ang),0+30,cx-200*Math.tan(ang)+200*Math.tan(ang)*ph,30+170*ph,K.amber,3);LN(g,cx,200,cx,60,K.gray,1,[4,4]);if(ph>=1)AW(g,cx,200,cx+200*Math.tan(ang),30,K.amber,3);TX(g,'Tushish burchagi = qaytish burchagi',cx+10,250,{s:12});}
else{for(let i=0;i<30;i++){const x=40+i*18,y=150+Math.sin(i*0.5-t*p.q*2)*30*(1-i/45);CI(g,x,y,5,K.purple);}TX(g,'Tebranish muhit bo‘ylab tarqaladi',40,260,{s:12});}
return 'Fizika tabiat hodisalarini o‘rganadi: mexanik, issiqlik, elektr, yorug‘lik va tovush hodisalari.';}};

SIMS.expTheory={s:1,c:[['L','Mayatnik uzunligi',0.2,2,0.1,1,'m'],['n','Tajribalar soni',1,8,1,4,'']],
d(g,t,p,W,H){const gr=GRAPH(g,60,30,400,200,2,3,'L, m','T, s');g.strokeStyle=K.blue;g.lineWidth=3;g.beginPath();for(let i=0;i<=40;i++){const L=i*0.05,T=2*P*Math.sqrt(L/G);i?g.lineTo(gr.X(L),gr.Y(T)):g.moveTo(gr.X(L),gr.Y(T));}g.stroke();
const noise=[0.05,-0.07,0.04,-0.03,0.08,-0.05,0.02,-0.06];for(let i=0;i<p.n;i++){const L=0.25*(i+1),T=2*P*Math.sqrt(L/G)+noise[i];CI(g,gr.X(L),gr.Y(T),5,K.red);}
const th=0.4*Math.cos(2*P*3/(2*P*Math.sqrt(p.L/G))),px=540,py=40,len=40+p.L*60;LN(g,px,py,px+len*Math.sin(th),py+len*Math.cos(th),K.gray,2);CI(g,px+len*Math.sin(th),py+len*Math.cos(th),10,K.blue);
TX(g,'— nazariya: T = 2π√(L/g)',70,260,{c:K.blue,b:1,s:12});TX(g,'● tajriba natijalari',300,260,{c:K.red,b:1,s:12});
return 'L = '+f1(p.L)+' m uchun nazariy davr T = '+f1(2*P*Math.sqrt(p.L/G))+' s. Tajriba nuqtalari nazariy chiziq atrofida joylashadi.';}};

/* ===== 1–4 §: HARAKAT, FAZO, VAQT, VEKTOR ===== */
SIMS.rel={T:6,c:[['vt','Poyezd tezligi (Yerga nisbatan)',0,20,1,10,'m/s'],['vm','Odam tezligi (poyezdga nisbatan)',-5,5,1,2,'m/s'],['fr','Sanoq jismi (0 = Yer, 1 = poyezd)',0,1,1,0,'']],
d(g,t,p,W,H){const S=3,gy=215;GND(g,gy,W);const sh=p.fr?p.vt*t*S:0;for(let i=0;i<8;i++){const x=(((i*110-sh)%880)+880)%880-100;LN(g,x,gy,x,gy-40,'#92400e',5);CI(g,x,gy-55,20,K.green);}
const tx=p.fr?200:20+p.vt*t*S;RC(g,tx,gy-75,190,55,'#fca5a5',K.ink);for(let i=0;i<4;i++)RC(g,tx+12+i*44,gy-65,30,22,'#e0f2fe',K.ink);CI(g,tx+30,gy-12,8,'#111');CI(g,tx+160,gy-12,8,'#111');
const u=cl(95+p.vm*t*S,15,175);MAN(g,tx+u,gy-20,K.blue);if(p.vt)AW(g,tx+60,gy-95,tx+60+p.vt*5,gy-95,K.red,3);TX(g,'v poyezd',tx+60,gy-100,{s:11,c:K.red});
TX(g,'Sanoq jismi: '+(p.fr?'POYEZD':'YER'),14,22,{b:1,s:14,c:K.purple});
return 'Odamning Yerga nisbatan tezligi: '+(p.vt+p.vm)+' m/s; poyezdga nisbatan: '+p.vm+' m/s. Sanoq jismini almashtiring: '+(p.fr?'daraxtlar orqaga ketmoqda.':'poyezd oldinga ketmoqda.');}};

SIMS.clock={T:12,c:[['L','Mayatnik uzunligi',0.25,2.5,0.25,1,'m']],
d(g,t,p,W,H){const Tp=2*P*Math.sqrt(p.L/G),th=0.4*Math.cos(2*P*t/Tp),px=150,py=25,len=50+p.L*70,bx=px+len*Math.sin(th),by=py+len*Math.cos(th);RC(g,px-40,py-8,80,8,K.gray);LN(g,px,py,bx,by,K.ink,2);CI(g,bx,by,13,K.blue,K.ink);
const cx=450,cy=130,r=80;CI(g,cx,cy,r,'#fff',K.ink);for(let i=0;i<60;i++){const a=i*P/30;LN(g,cx+(r-(i%5?5:10))*Math.sin(a),cy-(r-(i%5?5:10))*Math.cos(a),cx+r*Math.sin(a),cy-r*Math.cos(a),K.ink,i%5?1:2);}
const a=2*P*t/60;LN(g,cx,cy,cx+(r-8)*Math.sin(a),cy-(r-8)*Math.cos(a),K.red,3);CI(g,cx,cy,5,K.ink);TX(g,'Sekundomer',cx,cy+r+20,{a:'center',b:1});TX(g,'t = '+f1(t)+' s',cx,cy+r+40,{a:'center',s:16,b:1,c:K.red});
return 'Mayatnik davri T = '+f1(Tp)+' s. O‘tgan vaqt: '+f1(t)+' s = '+Math.floor(t/Tp)+' ta to‘liq tebranish. 1 min = 60 s, 1 soat = 3600 s.';}};

SIMS.space={s:1,c:[['dm','Fazo o‘lchamlari soni',1,3,1,3,''],['x','x',0,5,1,3,''],['y','y',0,4,1,2,''],['z','z',0,4,1,2,'']],
d(g,t,p,W,H){const ox=130,oy=250,k=48,zx=24,zy=-16,x=p.x,y=p.dm>1?p.y:0,z=p.dm>2?p.z:0;const X=(a,b,c)=>ox+a*k+c*zx,Y=(a,b,c)=>oy-b*k+c*zy*1;
AW(g,ox,oy,X(6,0,0),oy,K.ink,2);TX(g,'x',X(6,0,0)+8,oy+4,{b:1});if(p.dm>1){AW(g,ox,oy,ox,oy-5*k,K.ink,2);TX(g,'y',ox-4,oy-5*k-6,{b:1});}if(p.dm>2){AW(g,ox,oy,X(0,0,5),Y(0,0,5),K.ink,2);TX(g,'z',X(0,0,5)+6,Y(0,0,5),{b:1});}
const px=X(x,y,z),py=Y(x,y,z);LN(g,px,py,X(x,0,0),Y(x,0,0),K.gray,1,[4,4]);if(p.dm>1)LN(g,X(x,0,z),Y(x,0,z),X(x,y,z),Y(x,y,z),K.gray,1,[4,4]);if(p.dm>2){LN(g,X(x,0,z),Y(x,0,z),X(x,0,0),Y(x,0,0),K.gray,1,[4,4]);}CI(g,px,py,8,K.red,K.ink);TX(g,'M',px+10,py-8,{b:1,c:K.red});
TX(g,p.dm==1?'1 o‘lcham: chiziq':p.dm==2?'2 o‘lcham: tekislik':'3 o‘lcham: hajm — bizning fazomiz',360,40,{b:1,s:15,c:K.purple});
return 'M nuqta koordinatalari: ('+x+(p.dm>1?'; '+y:'')+(p.dm>2?'; '+z:'')+'). Fazodagi nuqtaning o‘rnini aniqlash uchun '+p.dm+' ta koordinata kerak.';}};

SIMS.matpoint={T:6,c:[['r','Masofa / jism o‘lchami nisbati',1,200,1,60,'×']],
d(g,t,p,W,H){const gy=200;GND(g,gy,W);const L=560/p.r,x=40+(560-L)*(t/6);LN(g,40,gy+20,600,gy+20,K.ink,2);LN(g,40,gy+14,40,gy+26);LN(g,600,gy+14,600,gy+26);TX(g,'Masofa D',320,gy+40,{a:'center',b:1});
if(p.r>=10){CI(g,x,gy-12,5,K.red);TX(g,'MODDIY NUQTA',x,gy-30,{a:'center',c:K.red,b:1,s:12});}else{CAR(g,x,gy,K.blue,Math.max(L,20));}
TX(g,p.r>=10?'Masofa jism o‘lchamidan ancha katta — jismni nuqta deb olamiz':'Masofa jism o‘lchamiga yaqin — jism o‘lchamini hisobga olish kerak',20,28,{b:1,s:13,c:K.purple});

SIMS.traj={T:6,c:[['am','Yo‘l egriligi',-60,60,5,50,'']],
d(g,t,p,W,H){const gy=200,x0=60,x1=560,pos=u=>[x0+(x1-x0)*u,gy-p.am*Math.sin(P*u)*1.5];GND(g,gy+60,W,'#f0f9ff');const u=t/6;g.strokeStyle=K.blue;g.lineWidth=3;g.beginPath();let len=0,pr=null;for(let i=0;i<=100;i++){const q=pos(i/100*u);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);if(pr)len+=Math.hypot(q[0]-pr[0],q[1]-pr[1]);pr=q;}g.stroke();
const A=pos(0),B=pos(1),Q=pos(u);LN(g,A[0],A[1],B[0],B[1],K.red,2,[6,5]);AW(g,A[0],A[1],Q[0],Q[1],K.green,3);CI(g,A[0],A[1],6,K.ink);CI(g,B[0],B[1],6,K.ink);CI(g,Q[0],Q[1],8,K.red);TX(g,'A',A[0]-16,A[1]+5,{b:1});TX(g,'B',B[0]+10,B[1]+5,{b:1});
const full=(()=>{let s=0,pp=pos(0);for(let i=1;i<=100;i++){const q=pos(i/100);s+=Math.hypot(q[0]-pp[0],q[1]-pp[1]);pp=q;}return s;})();
return 'Yo‘l (egri chiziq uzunligi) = '+f1(len/10)+' m — skalyar. Ko‘chish (A dan hozirgi nuqtaga vektor) = '+f1(Math.hypot(Q[0]-A[0],Q[1]-A[1])/10)+' m. To‘liq yo‘lda: yo‘l '+f1(full/10)+' m, ko‘chish '+f1(50)+' m.';}};

SIMS.vec={s:1,c:[['a','a vektor moduli',0,6,0.5,4,''],['aa','a burchagi',0,180,15,0,'°'],['b','b vektor moduli',0,6,0.5,3,''],['ba','b burchagi',0,180,15,90,'°']],
d(g,t,p,W,H){const ox=100,oy=250,k=36,r=d=>d*P/180,ax=p.a*Math.cos(r(p.aa)),ay=p.a*Math.sin(r(p.aa)),bx=p.b*Math.cos(r(p.ba)),by=p.b*Math.sin(r(p.ba));
const S=(x,y)=>[ox+x*k,oy-y*k];let o=S(0,0),A=S(ax,ay),B=S(bx,by),C=S(ax+bx,ay+by);LN(g,o[0],o[1],B[0],B[1],K.gray,1,[4,4]);LN(g,B[0],B[1],C[0],C[1],K.gray,1,[4,4]);AW(g,o[0],o[1],A[0],A[1],K.blue,3);AW(g,A[0],A[1],C[0],C[1],K.green,3);AW(g,o[0],o[1],C[0],C[1],K.red,4);TX(g,'a',(o[0]+A[0])/2,(o[1]+A[1])/2-8,{c:K.blue,b:1});TX(g,'b',(A[0]+C[0])/2+6,(A[1]+C[1])/2,{c:K.green,b:1});TX(g,'c = a + b',C[0]+8,C[1],{c:K.red,b:1});
const c=Math.hypot(ax+bx,ay+by);TX(g,'Skalyar yig‘indi: a + b = '+f1(p.a+p.b),380,60,{b:1,s:14});TX(g,'Vektor yig‘indi: |c| = '+f1(c),380,85,{b:1,s:14,c:K.red});
return 'Vektorlar yo‘nalishiga bog‘liq: bir tomonga yo‘nalsa |c| = a + b, qarama-qarshi bo‘lsa |c| = |a − b|. Burchaklarni o‘zgartirib ko‘ring.';}};

SIMS.sv={s:1,c:[['al','Ikki kuch orasidagi burchak',0,180,15,0,'°']],
d(g,t,p,W,H){RC(g,20,20,270,250,'#f8fafc','#cbd5e1');RC(g,310,20,310,250,'#f8fafc','#cbd5e1');TX(g,'SKALYAR (massa)',155,45,{a:'center',b:1,c:K.blue});RC(g,40,80,60,50,'#93c5fd',K.ink);TX(g,'3 kg',70,110,{a:'center',b:1});RC(g,120,80,80,50,'#93c5fd',K.ink);TX(g,'4 kg',160,110,{a:'center',b:1});TX(g,'3 kg + 4 kg = 7 kg',155,190,{a:'center',b:1,s:16});TX(g,'Yo‘nalishi yo‘q',155,225,{a:'center',s:12,c:K.gray});
TX(g,'VEKTOR (kuch)',465,45,{a:'center',b:1,c:K.red});const ox=400,oy=200,r=p.al*P/180,F1=[3*20,0],F2=[4*20*Math.cos(r),-4*20*Math.sin(r)];AW(g,ox,oy,ox+F1[0],oy,K.blue,3);AW(g,ox,oy,ox+F2[0],oy+F2[1],K.green,3);AW(g,ox,oy,ox+F1[0]+F2[0],oy+F1[1]+F2[1],K.red,4);
const R=Math.hypot(3+4*Math.cos(r),4*Math.sin(r));TX(g,'F₁ = 3 N, F₂ = 4 N',465,235,{a:'center',s:12});TX(g,'Teng ta’sir etuvchi R = '+f1(R)+' N',465,258,{a:'center',b:1,c:K.red});
return 'Skalyar kattaliklar (massa, vaqt, yo‘l, temperatura) oddiy qo‘shiladi. Vektor kattaliklar (kuch, tezlik, ko‘chish) yo‘nalishi bilan qo‘shiladi.';}};

/* ===== 5–8 §: TEKIS HARAKAT ===== */
SIMS.strobe={T:6,c:[['tp','Harakat turi (0 tekis, 1 notekis)',0,1,1,0,'']],
d(g,t,p,W,H){const gy=190;GND(g,gy,W);const pos=tt=>p.tp?3*tt*tt*1.4+10*tt:50*tt*0.9+10;const x0=20;for(let i=0;i<=5;i++){const x=x0+pos(i)*(p.tp?1.0:1.0)*(p.tp?0.62:1);if(x>600)break;CI(g,x+30,gy-18,10,'rgba(37,99,235,.25)');TX(g,i+' s',x+30,gy+22,{a:'center',s:11});if(i>0){const xp=x0+pos(i-1)*(p.tp?0.62:1);TX(g,String(Math.round((x-xp)/5.2))+' m',(x+xp)/2+30,gy+42,{a:'center',s:11,c:K.red});}}
const x=x0+pos(t)*(p.tp?0.62:1);CAR(g,x,gy,K.blue);
return p.tp?'Notekis harakat: teng vaqtlarda jism turlicha yo‘l bosadi.':'Tekis harakat: teng vaqt oralig‘ida jism bir xil yo‘l bosadi (har sekundda ≈ 10 m).';}};

SIMS.uni={T:6,c:[['v','Tezlik v',1,30,1,10,'m/s']],
d(g,t,p,W,H){const gy=170,sc=2.8;GND(g,gy,W);for(let i=0;i<=200;i+=20){LN(g,20+i*sc,gy,20+i*sc,gy+8);TX(g,i+'',20+i*sc,gy+22,{a:'center',s:10,c:K.gray});}TX(g,'m',612,gy+22,{s:10,c:K.gray});const s=p.v*t;for(let i=1;i<=6;i++){if(i<=t)CI(g,20+p.v*i*sc,gy+6,4,K.red);}
CAR(g,20+s*sc,gy,K.blue);AW(g,30+s*sc,gy-50,30+s*sc+p.v*3,gy-50,K.red,3);TX(g,'v = '+p.v+' m/s',30+s*sc,gy-58,{s:11,c:K.red,b:1});TX(g,'t = '+f1(t)+' s',40,30,{b:1,s:16,c:K.purple});TX(g,'s = v·t = '+f1(s)+' m',40,55,{b:1,s:16,c:K.blue});
return 'Tekis harakatda tezlik doimiy: v = s / t. '+p.v+' m/s — har sekundda '+p.v+' m yo‘l. Hozir s = '+p.v+' · '+f1(t)+' = '+f1(s)+' m.';}};

SIMS.unit={s:1,c:[['kmh','Tezlik',0,144,6,72,'km/soat']],

return p.kmh+' km/soat = '+f1(ms)+' m/s. Masalan, 36 km/soat = 10 m/s, 72 km/soat = 20 m/s.';}};

SIMS.unit2={T:7,c:[['v','Tezlik v',2,30,1,10,'m/s'],['s','Bosib o‘tiladigan yo‘l s',20,200,10,100,'m']],
d(g,t,p,W,H){const gy=170,sc=2.8,tt=p.s/p.v,x=Math.min(p.v*t,p.s);GND(g,gy,W);for(let i=0;i<=200;i+=20){LN(g,20+i*sc,gy,20+i*sc,gy+8);TX(g,i+'',20+i*sc,gy+22,{a:'center',s:10,c:K.gray});}LN(g,20+p.s*sc,gy-60,20+p.s*sc,gy,K.red,3);TX(g,'finish',20+p.s*sc,gy-66,{a:'center',c:K.red,b:1,s:12});CAR(g,20+x*sc,gy,K.blue);
TX(g,'t = s / v = '+p.s+' / '+p.v+' = '+f1(tt)+' s',40,40,{b:1,s:16,c:K.purple});TX(g,'sekundomer: '+f1(Math.min(t,tt))+' s',40,66,{b:1,s:14});

LN(g,A.X(0),A.Y(p.s0),A.X(8),A.Y(p.s0+p.v*8),K.blue,3);CI(g,A.X(t),A.Y(p.s0+p.v*t),6,K.red);

SIMS.avg={T:10,c:[['v1','1-qism tezligi',1,20,1,15,'m/s'],['t1','1-qism vaqti',1,6,1,2,'s'],['v2','2-qism tezligi',1,20,1,5,'m/s'],['t2','2-qism vaqti',1,6,1,6,'s']],

d(g,t,p,W,H){const sc=560/Math.max(1,p.v1*p.t1+p.v2*p.t2),tot=p.t1+p.t2,S=p.v1*p.t1+p.v2*p.t2,va=S/tot,tt=Math.min(t*tot/10,tot);const pos=q=>q<=p.t1?p.v1*q:p.v1*p.t1+p.v2*(q-p.t1);GND(g,250,W);

CAR(g,20+pos(tt)*sc,100,K.blue,50);CAR(g,20+va*tt*sc,200,K.green,50);const inst=tt<=p.t1?p.v1:p.v2;TX(g,'Oniy tezlik: '+inst+' m/s',380,40,{b:1,s:14,c:K.red});TX(g,'t = '+f1(tt)+' s',20,40,{b:1,s:14});
return 'O‘rtacha tezlik v = (barcha yo‘l) / (barcha vaqt) = '+S+' / '+tot+' = '+f1(va)+' m/s. Bu tezliklarning o‘rta arifmetigi ('+f1((p.v1+p.v2)/2)+' m/s) emas!';}};

SIMS.inst={s:1,c:[['t0','Vaqt momenti t',1,5,0.5,3,'s'],['dt','Vaqt oralig‘i Δt',0.1,3,0.1,2,'s']],
d(g,t,p,W,H){const s=q=>1.5*q*q+3*q,gr=GRAPH(g,50,30,340,210,8,100,'t, s','s, m');g.strokeStyle=K.blue;g.lineWidth=3;g.beginPath();for(let i=0;i<=80;i++){const q=i/10;i?g.lineTo(gr.X(q),gr.Y(s(q))):g.moveTo(gr.X(q),gr.Y(s(q)));}g.stroke();
const a=p.t0,b=p.t0+p.dt;LN(g,gr.X(a-1.5),gr.Y(s(a)-(3*a+3)*1.5),gr.X(a+3),gr.Y(s(a)+(3*a+3)*3),K.green,2,[5,4]);LN(g,gr.X(a),gr.Y(s(a)),gr.X(b),gr.Y(s(b)),K.red,3);CI(g,gr.X(a),gr.Y(s(a)),5,K.ink);CI(g,gr.X(b),gr.Y(s(b)),5,K.red);
const va=(s(b)-s(a))/p.dt,vi=3*a+3;TX(g,'Oniy tezlik (urinma): '+f1(vi)+' m/s',420,80,{b:1,c:K.green});TX(g,'O‘rtacha tezlik (kesuvchi): '+f1(va)+' m/s',420,110,{b:1,c:K.red});TX(g,'Δt kamaysa, ikkalasi yaqinlashadi',420,150,{s:12,c:K.gray});
return 'Δt qancha kichik bo‘lsa, o‘rtacha tezlik oniy tezlikka shuncha yaqin: hozir '+f1(va)+' va '+f1(vi)+' m/s.';}};

/* ===== 9–14 §: TEKIS O‘ZGARUVCHAN HARAKAT ===== */
SIMS.acc={T:6,c:[['v0','Boshlang‘ich tezlik v₀',0,10,1,0,'m/s'],['a','Tezlanish a',-2,6,0.5,2,'m/s²']],
d(g,t,p,W,H){const gy=170,sc=3;GND(g,gy,W);const ts=p.a<0?p.v0/-p.a:1e9,tt=Math.min(t,ts),s=p.v0*tt+p.a*tt*tt/2,v=p.v0+p.a*tt;for(let i=0;i<=6;i++){if(i>t)break;const ii=Math.min(i,ts);CI(g,20+(p.v0*ii+p.a*ii*ii/2)*sc+30,gy+10,4,K.red);}
for(let i=0;i<=180;i+=20){LN(g,20+i*sc,gy,20+i*sc,gy+4,K.gray,1);}CAR(g,20+s*sc,gy,K.blue);AW(g,30+s*sc,gy-50,30+s*sc+Math.max(v,0)*6,gy-50,K.red,3);TX(g,'v = '+f1(v)+' m/s',40,35,{b:1,s:16,c:K.red});TX(g,'s = '+f1(s)+' m',40,60,{b:1,s:16,c:K.blue});TX(g,'a = '+p.a+' m/s²',300,35,{b:1,s:16,c:K.green});
return 'Tezlanish a = (v − v₀) / t. Har sekundda tezlik '+p.a+' m/s ga o‘zgaradi. Qizil nuqtalar — har sekunddagi o‘rinlar: oraliqlar '+(p.a?'o‘zgaradi':'teng')+'.';}};

SIMS.accg={T:6,c:[['v0','Boshlang‘ich tezlik v₀',0,10,1,2,'m/s'],['a','Tezlanish a',0,4,0.5,2,'m/s²']],
d(g,t,p,W,H){const vm=40,A=GRAPH(g,50,40,240,190,6,vm,'t, s','v, m/s'),B=GRAPH(g,360,40,240,190,6,160,'t, s','s, m');
g.fillStyle='rgba(37,99,235,.2)';g.beginPath();g.moveTo(A.X(0),A.Y(0));g.lineTo(A.X(0),A.Y(p.v0));g.lineTo(A.X(t),A.Y(p.v0+p.a*t));g.lineTo(A.X(t),A.Y(0));g.fill();LN(g,A.X(0),A.Y(p.v0),A.X(6),A.Y(p.v0+p.a*6),K.blue,3);CI(g,A.X(t),A.Y(p.v0+p.a*t),6,K.red);
g.strokeStyle=K.green;g.lineWidth=3;g.beginPath();for(let i=0;i<=60;i++){const q=i/10,s=p.v0*q+p.a*q*q/2;i?g.lineTo(B.X(q),B.Y(s)):g.moveTo(B.X(q),B.Y(s));}g.stroke();CI(g,B.X(t),B.Y(p.v0*t+p.a*t*t/2),6,K.red);
